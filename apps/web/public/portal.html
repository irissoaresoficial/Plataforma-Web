<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Portal — Escuela de Sabiduría 33</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* ===========================================================================
   EL PORTAL — la apertura de la portada
   ===========================================================================

   UN SOLO ARCHIVO, SIN COMPILAR NADA. Se abre en /portal.html y funciona, así
   se mira y se decide antes de tocar la portada de verdad.

   ---------------------------------------------------------------------------
   UNA SOLA PELÍCULA, Y ESO LO CAMBIÓ TODO
   ---------------------------------------------------------------------------
   El plano que salió de Higgsfield hace el recorrido entero él solo: unos
   números en tinta flotando sobre marfil, unos hilos de oro que los van
   enlazando, y al final diez puntos de luz unidos por caminos — el árbol.
   Numerología que se vuelve kábala en cinco segundos, que es exactamente lo
   que Gerson pidió.

   Así que no hay tres vídeos pegados: hay UNO, y el scroll lo pasa. La
   transcendencia no se cuenta con un corte, se ve ocurrir.

   LA FORMA QUE RECORRE LA PIEZA. Se empieza mirando los números por una
   VENTANA pequeña que se inclina hacia el ratón. Al bajar, esa ventana se
   abre hasta comerse la pantalla y uno se queda dentro del árbol. Y al final
   la misma forma se cierra sobre ella y se queda hecha su retrato. Una sola
   figura que se abre, te traga y se posa. No hay un segundo elemento que
   aprender.

   ---------------------------------------------------------------------------
   POR QUÉ ESTO ES CLARO Y NO OSCURO
   ---------------------------------------------------------------------------
   La primera versión era negra con letra en hueso, que es lo que pide una
   pieza inmersiva de manual. Con el metraje de verdad delante se cayó sola:
   los dos planos son MARFIL, altísimos de luz. Hueso sobre marfil no se lee —
   ni con velo, ni con sombra, ni con nada.

   Y resulta que lo correcto era además lo de la casa: la web de Iris es
   marfil con tinta y vino. Así que el portal es claro, la letra es tinta, y
   el oro de los planos hace de acento él solo. Un mundo, no dos.

   LAS FUENTES NO SE PIDEN A GOOGLE. La web las sirve desde su propio
   servidor por el reglamento europeo. Aquí se usa la misma pila de reserva
   que declara `globals.css`; al llevarlo a la portada hereda las de verdad.
=========================================================================== */

:root{
  /* Los mismos tokens de globals.css. El marfil de los planos manda. */
  --tinta:#221d1f;
  --tinta-2:#4a4244;
  --tinta-3:#6d6467;
  --vino:#451a25;
  --oro:#a9884f;
  --oro-honda:#7d5f1e;      /* el dorado que SÍ se lee como texto */
  --marfil:#efe9dd;
  --marfil-hondo:#e3dbcb;
  --papel:#fbf8f2;
  --linea:rgba(34,29,31,.22);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  font-family:var(--sans);
  color:var(--tinta);
  background:var(--marfil);
  color-scheme:light;
  font-synthesis:none;
}

*{box-sizing:border-box}
body{margin:0;width:100%;background:var(--marfil);overflow-x:hidden}
body:not(.antesala-lista){overflow:hidden;height:100%}

/* LA PISTA Y LA ESCENA. La pista es alto y nada más: es el carrete que se
   gasta al bajar. La escena va pegada arriba y ocupa la pantalla entera, así
   que lo que se mueve no es la página, es lo que pasa dentro. */
.pista{position:relative;height:460vh}
.recorrido{position:sticky;top:0;width:100%;height:100svh;min-height:540px;overflow:hidden;
  background:
    radial-gradient(120% 86% at 50% 34%, var(--papel) 0%, var(--marfil) 52%, var(--marfil-hondo) 100%)}

.velo{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:
    linear-gradient(to bottom,transparent 56%,rgba(239,233,221,.88) 84%,var(--marfil) 100%),
    linear-gradient(to right,rgba(239,233,221,.95) 0%,rgba(239,233,221,.6) 12%,transparent 25%)}

.marco{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}

/* ----------------------------------------------------------- la cabecera */
.cabecera{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);
  top:max(clamp(18px,3.1vh,28px),env(safe-area-inset-top,0px));
  display:flex;justify-content:space-between;align-items:center;gap:16px;pointer-events:none}
/* La cabecera y el texto de abajo cruzan la pantalla de lado a lado y van por
   encima de la ventana: sin esto se comen el ratón en su parte vacía. Es de
   los fallos que no se ven leyendo, sólo intentando pulsar. */
.cabecera-acciones{margin-left:auto;display:flex;align-items:center;gap:10px;pointer-events:auto}
.menu-nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid var(--linea);
  background:rgba(251,248,242,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px}
.menu-nav a{color:var(--tinta-2);text-decoration:none;padding:8px 18px;border-radius:999px;line-height:1;font-size:15px;
  transition:background .25s ease,color .25s ease}
.menu-nav a.puesto{background:var(--vino);color:var(--papel)}
.entrar{height:42px;padding:0 22px;border:0;border-radius:999px;background:var(--vino);color:var(--papel);
  font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;
  box-shadow:0 1px 2px rgba(34,29,31,.1),0 10px 24px rgba(69,26,37,.18)}

/* ----------------------------------------------------- la lista de etapas */
.etapas{left:max(clamp(18px,1.95vw,28px),env(safe-area-inset-left,0px));top:50%;transform:translateY(-43%);
  display:flex;flex-direction:column;gap:10px;font-size:15px}
.etapa{display:flex;align-items:center;min-height:20px;color:var(--tinta-2);letter-spacing:.01em;
  transition:color .4s ease}
.etapa.puesta{font-size:17px;font-weight:700;gap:9px;color:var(--vino)}
.etapa.puesta:before{content:'';width:13px;height:13px;border-radius:50%;background:var(--oro);flex:none;
  box-shadow:0 0 0 4px rgba(169,136,79,.2)}

/* ------------------------------------------------------------- la ventana */
.ventana-zona{left:50%;top:50%;width:min(340px,32vw);transform:translate(-50%,-56%)}
.ventana{position:relative;display:block;width:100%;aspect-ratio:340/380;padding:0;border:0;
  border-radius:110px;background:transparent;transform:none!important}
/* El vídeo y la foto NO se ven: existen sólo para que el lienzo los copie. */
.ventana video,.ventana img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.lienzo-ventana{position:fixed;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}

/* LA ÚLTIMA ETAPA: la misma ventana, hecha retrato.
   Su foto es vertical y la pantalla apaisada: a sangre la cortaba por los
   ojos. De pie y a un lado se la ve, y el texto se va al otro lado donde
   tiene fondo limpio debajo. */
.recorrido[data-etapa="iris"] .ventana-zona{left:auto;
  right:max(clamp(28px,5vw,96px),env(safe-area-inset-right,0px));top:50%;width:min(330px,30vw);
  transform:translateY(-50%)}
.recorrido[data-etapa="iris"] .ventana{aspect-ratio:3/4;border-radius:999px 999px 26px 26px}
.recorrido[data-etapa="iris"] .contenido{display:block;right:auto;width:min(560px,47vw)}
.recorrido[data-etapa="iris"] .contenido h1{margin-bottom:22px}
.recorrido[data-etapa="iris"] .contenido dl{width:100%}
.recorrido[data-etapa="iris"] .etapas{animation:none;opacity:0;pointer-events:none}

/* --------------------------------------------------------- el contenido */
.contenido{left:max(clamp(28px,4vw,58px),env(safe-area-inset-left,0px));
  right:max(clamp(28px,3vw,44px),env(safe-area-inset-right,0px));
  bottom:max(clamp(24px,3vh,32px),env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-between;align-items:flex-end;gap:40px;pointer-events:none}
/* El tamaño del titular lo manda la palabra más larga: «NUMEROLOGÍA» son once
   letras y a 13,5vw ocupaba la fila entera, echando la ficha fuera de la
   pantalla. Se veía un titular precioso y ni uno de los cuatro renglones. */
.contenido h1{font-family:var(--serif);font-size:clamp(54px,9vw,132px);font-weight:400;line-height:.84;
  margin:0 0 -.02em;letter-spacing:-.032em;color:var(--vino);transform:translateX(-6px);opacity:0;
  flex:0 1 auto;min-width:0}
.contenido dl{width:min(420px,32vw);flex:none;margin:0;font-size:15px;min-width:0}
.dato{display:grid;grid-template-columns:148px 1fr;gap:18px;padding:10px 0;
  border-bottom:1px solid var(--linea);opacity:0;min-width:0}
.dato:last-child{border-bottom:0}
.dato dt{font-weight:700;color:var(--oro-honda)}
.dato dd{margin:0;color:var(--tinta);line-height:1.5;min-width:0}

/* ------------------------------------------------------------- lo demás */
.baja{position:absolute;z-index:5;right:max(clamp(20px,2.2vw,34px),env(safe-area-inset-right,0px));top:50%;
  transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-3);pointer-events:none;
  writing-mode:vertical-rl;transition:opacity .5s ease}
.baja span{display:block;width:1px;height:38px;background:linear-gradient(to bottom,var(--tinta-3),transparent);
  animation:cae 1.9s ease-in-out infinite}
@media(max-width:640px){.baja{display:none}}
@keyframes cae{0%{transform:scaleY(.25);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}
  50.1%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(.25);transform-origin:bottom}}

/* =========================================================== LA ANTESALA */
/* Los tres primeros segundos: el papel y la tinta en macro, una cuenta de 0 a
   100 y el sello en el centro, que al terminar se va a su esquina. No es
   decoración: es el tiempo que tardan en estar listos los vídeos, y contarlo
   es más honesto que una rueda girando. */
.antesala{position:absolute;inset:0;z-index:20;background:var(--marfil-hondo);overflow:hidden}
.antesala video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.antesala-velo{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(239,233,221,.3),rgba(239,233,221,.85))}
/* Al terminar se DESVANECE, y es un arreglo: va después de la escena en el
   documento, así que «de fondo» con la misma capa seguía pintando encima y
   tapaba el metraje de todas las etapas. */
.antesala.al-fondo{z-index:0;opacity:0;pointer-events:none;transition:opacity 1s ease}

.sello{position:fixed;z-index:22;left:50%;top:50%;width:78px;height:78px;transform:translate(-50%,-50%);
  will-change:left,top,width,height,transform;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),
             width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),
             transform 2s cubic-bezier(.16,1,.3,1)}
.sello.encajado{left:clamp(18px,1.95vw,28px);top:max(clamp(18px,3.1vh,28px),env(safe-area-inset-top,0px));
  width:42px;height:42px;transform:none}
.sello.asentado{z-index:5}

.cuenta{position:fixed;z-index:22;left:50%;bottom:max(clamp(22px,3.1vh,28px),env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-end;gap:5px;transform:translateX(-50%);line-height:1;
  font-variant-numeric:tabular-nums;color:var(--vino)}
.cuenta>span:first-child{font-family:var(--serif);font-size:clamp(44px,7vw,64px);font-weight:400}
.cuenta .porciento{font-size:22px;padding-bottom:5px;color:var(--oro-honda)}
.cuenta.se-va{animation:cuenta-fuera .75s cubic-bezier(.22,1,.36,1) both}
@keyframes cuenta-fuera{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.antesala-lista) .cursor{opacity:0!important}

/* ================================================================ CURSOR */
html,body,a{cursor:none!important}
.cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;pointer-events:none;opacity:0;
  transition:opacity .2s ease}
.cursor.se-ve{opacity:1}
.cursor-punto,.cursor-aro{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-punto{width:9px;height:9px;background:var(--vino)}
.cursor-aro{width:34px;height:34px;border:1px solid var(--vino);background:rgba(69,26,37,.07)}

/* ========================================================== LAS ENTRADAS */
body:not(.abierto) .cabecera,
body:not(.abierto) .etapas,
body:not(.abierto) .contenido h1,
body:not(.abierto) .contenido .dato{opacity:0}
.abierto .cabecera{animation:baja .9s cubic-bezier(.22,1,.36,1) .1s both}
.abierto .etapas{animation:entra-lado .9s cubic-bezier(.22,1,.36,1) .65s both}
.revelando-contenido h1{animation:sube-titulo 1.05s cubic-bezier(.16,1,.3,1) both}
.revelando-contenido .dato{animation:sube-dato .72s cubic-bezier(.22,1,.36,1) both}
.revelando-contenido .dato:nth-child(1){animation-delay:.5s}
.revelando-contenido .dato:nth-child(2){animation-delay:.64s}
.revelando-contenido .dato:nth-child(3){animation-delay:.78s}
.revelando-contenido .dato:nth-child(4){animation-delay:.92s}
.etapas.cambiando .etapa{animation:fila .58s cubic-bezier(.22,1,.36,1) both}
.etapas.cambiando .etapa:nth-child(1){animation-delay:.02s}
.etapas.cambiando .etapa:nth-child(2){animation-delay:.09s}
.etapas.cambiando .etapa:nth-child(3){animation-delay:.16s}
.etapas.cambiando .etapa.puesta:before{animation:punto .55s cubic-bezier(.22,1,.36,1) .18s both}

@keyframes baja{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes entra-lado{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes sube-titulo{from{opacity:0;filter:blur(12px);transform:translate(-6px,42px)}to{opacity:1;filter:blur(0);transform:translate(-6px,0)}}
@keyframes sube-dato{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes fila{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes punto{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* ============================================================= ESTRECHO */
@media(max-width:900px){
  .menu-nav{display:none}
  .ventana-zona{width:min(300px,48vw)}
  .contenido h1{font-size:clamp(68px,15vw,130px)}
  .contenido dl{width:43vw}
  .dato{grid-template-columns:116px 1fr;font-size:14px}
  .etapas{font-size:14px}
  .etapa.puesta{font-size:16px}
  .recorrido[data-etapa="iris"] .ventana-zona{width:min(260px,40vw)}
  .recorrido[data-etapa="iris"] .contenido{width:min(440px,50vw)}
}
@media(max-width:640px){
  .recorrido{min-height:600px}
  .etapas{display:none}
  .ventana-zona{top:42%;width:min(248px,62vw)}
  .contenido{left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));
    bottom:max(18px,env(safe-area-inset-bottom,0px));display:block}
  .contenido h1{font-size:clamp(56px,16vw,106px);margin-bottom:16px}
  .contenido dl{width:100%;font-size:13px}
  .dato{grid-template-columns:104px 1fr;gap:12px;padding:7px 0}
  .entrar{height:38px;padding:0 17px}
  .ventana{border-radius:70px}
  /* En vertical el retrato no cabe al lado: se va arriba y el texto debajo. */
  .recorrido[data-etapa="iris"] .ventana-zona{left:50%;right:auto;top:30%;width:min(200px,50vw);
    transform:translate(-50%,-50%)}
  .recorrido[data-etapa="iris"] .contenido{width:auto}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="pista" id="pista">
<main class="recorrido" id="recorrido" data-etapa="numerologia">

  <div class="antesala" id="antesala" aria-label="Abriendo">
    <video id="antesala-video" muted playsinline preload="auto">
      <source src="/video/antesala.webm" type="video/webm"><source src="/video/antesala.mp4" type="video/mp4">
    </video>
    <div class="antesala-velo"></div>
  </div>

  <img class="sello" id="sello" src="/images/logo-33.png" alt="Escuela de Sabiduría 33">

  <div class="cuenta" id="cuenta" aria-live="polite">
    <span id="cuenta-valor">0</span><span class="porciento">%</span>
  </div>

  <div class="velo" aria-hidden="true"></div>

  <header class="cabecera marco">
    <div class="cabecera-acciones">
      <nav class="menu-nav" aria-label="Secciones">
        <a class="puesto" href="/">Portada</a><a href="/cursos">Cursos</a><a href="/membresia">Escuela</a>
      </nav>
      <a class="entrar" href="https://app.escueladesabiduria33.com">Entrar</a>
    </div>
  </header>

  <aside class="etapas marco" id="etapas" aria-label="El recorrido"></aside>

  <canvas id="lienzo-ventana" class="lienzo-ventana" aria-hidden="true"></canvas>

  <section class="ventana-zona marco" aria-hidden="true">
    <div class="ventana" id="ventana">
      <video id="ventana-video" muted playsinline preload="auto">
        <source src="/video/recorrido.webm" type="video/webm"><source src="/video/recorrido.mp4" type="video/mp4">
      </video>
      <img id="ventana-imagen" src="/images/iris-consulta.jpg" alt="">
    </div>
  </section>

  <section class="contenido marco" aria-live="polite">
    <h1 id="titulo">NUMEROLOGÍA</h1>

  <div class="cursor" aria-hidden="true">

  </div>
</main>
</div>

<script>
(() => {
'use strict';

/* ======================================================================
   EL RECORRIDO, EN DATOS
   ======================================================================
   Lo que pone en cada ficha es verdad y es de esta casa: la base 22 sale de
   la fecha y la base 9 del nombre completo; el árbol tiene diez puntos y
   veintidós caminos. Un dato inventado en una pantalla que vende se nota, y
   no hacía falta: lo que hay ya es bastante. */
const ETAPAS = ['Numerología', 'Kábala', 'Iris Soares'];

const DATOS = {
  numerologia: {
    nombre: 'Numerología', orden: 0,
    datos: [
      ['Base 22:', 'Sale de tu fecha de nacimiento. Dice cómo te comportas.'],
      ['Base 9:', 'Sale de tu nombre completo. Dice de qué estás hecho.'],
      ['Lo que se mira:', 'Las repeticiones, los huecos y lo que se salta una generación.'],
      ['Desde:', 'Consulta online desde 2010.'],
    ],
  },
  kabala: {
    nombre: 'Kábala', orden: 1,
    datos: [
      ['El árbol:', 'Diez puntos y veintidós caminos. La carta entera cabe ahí.'],
      ['Imagen del alma:', 'Lo que traías antes de que nadie te pusiera un nombre.'],
      ['Cuentas abiertas:', 'Lo que en tu familia nunca se contó, y lo estás pagando tú.'],
      ['Ciclos vitales:', 'En qué tramo estás y qué toca ahora.'],
    ],
  },
  iris: {
    nombre: 'Iris Soares', orden: 2, retrato: true, foco: .3,
    datos: [
      ['Quién:', 'Iris Soares, numerología transgeneracional.'],
      ['Qué hace:', 'Levanta tu carta y te enseña a leerla.'],
      ['Para qué:', 'Para que las cuentas las hagas tú, no con apuntes.'],
      ['Por dónde empezar:', 'Una sesión, o la prueba gratis de la sinergia.'],
    ],
  },
};

/*
 * LOS CINCO TRAMOS, Y LOS DOS NÚMEROS QUE LLEVA CADA UNO.
 *
 * `ventana` dice cuánto está abierta la ventana al empezar y al acabar el
 * tramo: 0 es pequeña en el centro, 1 es la pantalla entera. `cinta` dice por
 * qué segundo va la película, de 0 a 1.
 *
 * Leídos en vertical se ve la pieza entera: la ventana se abre (0→1), te deja
 * dentro del árbol (1), y se cierra sobre ella (1→0). Y la cinta corre sin
 * parar de 0 a 1 mientras tanto, así que los números se vuelven el árbol sin
 * un solo corte. Eso es lo que no se puede hacer con tres vídeos pegados.
 */
const TRAMOS = [
  /* EL CORTE ESTÁ MEDIDO, NO PUESTO A OJO. Contando píxeles de luz en el
     plano, el árbol no está formado hasta el 0,84 de la cinta: con la Kábala
     empezando antes, el titular decía KÁBALA y en pantalla seguía habiendo
     números sueltos. Así que la etapa del árbol empieza donde hay árbol, y
     todo el armado —los hilos creciendo, los puntos encendiéndose— cae
     dentro del paso. El paso ES la transcendencia, no un corte entre dos
     cosas. */
  { etapa: 'numerologia', desde: 0,   hasta: .24, ventana: [0, 0], cinta: [0, .30] },
  { etapa: 'numerologia', desde: .24, hasta: .42, ventana: [0, 1], cinta: [.30, .84] },
  { etapa: 'kabala',      desde: .42, hasta: .68, ventana: [1, 1], cinta: [.84, 1] },
  { etapa: 'iris',        desde: .68, hasta: .82, ventana: [1, 0], cinta: [1, 1] },
  { etapa: 'iris',        desde: .82, hasta: 1,   ventana: [0, 0], cinta: [1, 1] },
];

/* ---------------------------------------------------------------- piezas */
const $ = (id) => document.getElementById(id);
const recorrido = $('recorrido');
const lienzo = $('lienzo-ventana');
const ctx = lienzo.getContext('2d');
const ventana = $('ventana');
const ventanaVideo = $('ventana-video');
const ventanaImagen = $('ventana-imagen');
const cursor = document.querySelector('.cursor');
const aro = document.querySelector('.cursor-aro');
const punto = document.querySelector('.cursor-punto');

let actual = 'numerologia';
let expansion = 0;
let girX = 0, girY = 0, metaX = 0, metaY = 0;
let ultimo = performance.now();

const suave = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const entre = (a, b, t) => a + (b - a) * t;

/* Quitar y volver a poner una clase para que su animación vuelva a correr. El
   `offsetWidth` de en medio no sobra: sin esa lectura el navegador junta los
   dos cambios en uno y la animación no se entera de que ha pasado nada. */
function reaviva(el, clase) {
  if (!el) return;
  el.classList.remove(clase);
  void el.offsetWidth;
  el.classList.add(clase);
}

/* ------------------------------------------------------------- pintar */
function midelienzo() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  lienzo.width = w * d; lienzo.height = h * d;
  lienzo.style.width = w + 'px'; lienzo.style.height = h + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
}

/* El metraje se pinta a pantalla completa y quieto, no dentro de la ventana.
   Esa es toda la gracia: la imagen se queda donde está y lo que se mueve es
   el agujero por donde se ve. */
function cubre(c, media) {
  const mw = media.videoWidth || media.naturalWidth;
  const mh = media.videoHeight || media.naturalHeight;
  if (!mw || !mh) return false;
  const w = window.innerWidth, h = window.innerHeight;
  const e = Math.max(w / mw, h / mh);
  c.drawImage(media, (w - mw * e) / 2, (h - mh * e) / 2, mw * e, mh * e);
  return true;
}

/* EL OTRO ENCUADRE: A LA VENTANA, NO A LA PANTALLA.
   Para un retrato el de arriba es un desastre: la ventana ocupa un tercio del
   ancho, así que de una foto vertical enseñaba un ojo. Comprobado mirándolo.
   `foco` dice qué altura de la foto —de 0 arriba a 1 abajo— tiene que quedar
   en el medio del hueco, y se limita a lo que cabe para no destapar un borde:
   antes se pierde encuadre que se enseña un hueco. */
function cubreVentana(c, media, cx, cy, cw, ch, foco) {
  const mw = media.videoWidth || media.naturalWidth;
  const mh = media.videoHeight || media.naturalHeight;
  if (!mw || !mh) return false;
  const e = Math.max(cw / mw, ch / mh);
  const dw = mw * e, dh = mh * e;
  let y = cy - dh / 2;
  if (foco != null && dh > ch) y = Math.min(cy - ch / 2, Math.max(cy + ch / 2 - dh, cy - dh * foco));
  c.drawImage(media, cx - dw / 2, y, dw, dh);
  return true;
}

/* Los puntos de un rectángulo redondeado, centrados en el origen: cada
   esquina se recorre en diez pasos, así que salen unos 44 puntos. Hacen falta
   sueltos para poder proyectarlos uno a uno. */
function puntosCaja(w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  const p = [];
  const esquinas = [
    [w / 2 - r, -h / 2 + r, -Math.PI / 2, 0],
    [w / 2 - r, h / 2 - r, 0, Math.PI / 2],
    [-w / 2 + r, h / 2 - r, Math.PI / 2, Math.PI],
    [-w / 2 + r, -h / 2 + r, Math.PI, Math.PI * 1.5],
  ];
  for (const [cx, cy, a0, a1] of esquinas) {
    for (let i = 0; i <= 10; i++) {
      const a = a0 + (a1 - a0) * (i / 10);
      p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  }
  return p;
}

/* Perspectiva de mentira con distancia focal 850. No es 3D y no hace falta
   que lo sea: lo que se busca es que el borde de arriba se aleje un poco
   cuando el ratón sube, y eso esto lo hace con cuatro líneas. */
function proyecta(x, y, rx, ry, cx, cy) {
  const ax = rx * Math.PI / 180, ay = ry * Math.PI / 180;
  const xx = x * Math.cos(ay), yy = y * Math.cos(ax);
  const z = x * Math.sin(ay) - y * Math.sin(ax);
  const p = 850 / (850 + z);
  return [cx + xx * p, cy + yy * p];
}

function pinta(ahora) {
  const dt = Math.min(40, ahora - ultimo);
  ultimo = ahora;
  const k = Math.min(1, dt * .009);
  girX += (metaX - girX) * k;
  girY += (metaY - girY) * k;

  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  const caja = ventana.getBoundingClientRect();
  if (caja.width < 1) return requestAnimationFrame(pinta);

  const e = expansion;
  const cx = entre(caja.left + caja.width / 2, w / 2, e);
  const cy = entre(caja.top + caja.height / 2, h / 2, e);
  const cw = entre(caja.width, w, e);
  const ch = entre(caja.height, h, e);
  /* El radio y la inclinación se relajan a la vez que se abre: a pantalla
     completa no puede quedar ni una esquina redonda ni un grado de giro. */
  const r = 110 * (1 - e);
  const rx = girX * (1 - e), ry = girY * (1 - e);
  const d = DATOS[actual];

  const pts = puntosCaja(cw, ch, r).map(([x, y]) => proyecta(x, y, rx, ry, cx, cy));
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.clip();
  /* Un fondo detrás del metraje: mientras el vídeo no tiene fotogramas, el
     hueco se ve como papel y no como un agujero negro. */
  ctx.fillStyle = '#e3dbcb';
  ctx.fillRect(0, 0, w, h);
  if (d.retrato) cubreVentana(ctx, ventanaImagen, cx, cy, cw, ch, d.foco);
  else cubre(ctx, ventanaVideo);
  ctx.restore();

  /* Un filo finísimo de tinta alrededor. Sin él, sobre marfil la ventana no
     tiene borde y se deshace en el fondo. */
  if (e < .985) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.globalAlpha = (1 - e) * .5;
    ctx.strokeStyle = 'rgba(34,29,31,.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  requestAnimationFrame(pinta);
}

/* ------------------------------------------------------------- dibujar */
let primera = true;
function dibuja() {
  const d = DATOS[actual];
  recorrido.dataset.etapa = actual;
  $('titulo').textContent = d.nombre.toUpperCase();

  const dl = $('datos');
  dl.innerHTML = '';
  for (const [clave, valor] of d.datos) {
    const fila = document.createElement('div');
    fila.className = 'dato';
    const dt = document.createElement('dt'); dt.textContent = clave;
    const dd = document.createElement('dd'); dd.textContent = valor;
    fila.append(dt, dd);
    dl.append(fila);
  }

  const lista = $('etapas');
  lista.innerHTML = '';
  ETAPAS.forEach((nombre, i) => {
    const s = document.createElement('span');
    s.className = 'etapa' + (i === d.orden ? ' puesta' : '');
    s.textContent = nombre;
    lista.append(s);
  });
  if (!primera) reaviva(lista, 'cambiando');
  primera = false;
}

function abreContenido() { reaviva(recorrido, 'revelando-contenido'); }

/* ======================================================================
   LA RUEDA MANDA
   ======================================================================
   No se pulsa nada: se baja. La pista mide cuatro pantallas y media y esa
   altura es el carrete. Cuánto se ha bajado —un número de 0 a 1— es lo único
   que decide qué se ve, así que parar a mitad deja la ventana parada a mitad
   y subir lo deshace. Eso es lo que separa esto de una animación que arranca
   sola al asomar: aquí la mano de quien mira pasa la película. */
let tramoPuesto = -1;

/** Pone el vídeo en el segundo que toca, sin reproducirlo. Es lo que hace que
 *  el metraje avance con la rueda en vez de ir por su cuenta. */
function rebobina(video, parte) {
  if (!video || !video.duration || !isFinite(video.duration)) return;
  const t = Math.max(0, Math.min(.995, parte)) * video.duration;
  if (Math.abs(video.currentTime - t) > .02) {
    try { video.currentTime = t; } catch (e) { /* todavía no se puede buscar */ }
  }
}

function alBajar() {
  const alto = $('pista').offsetHeight - window.innerHeight;
  const p = alto > 0 ? Math.max(0, Math.min(1, window.scrollY / alto)) : 0;

  let i = TRAMOS.length - 1;
  while (i > 0 && p < TRAMOS[i].desde) i--;
  const t = TRAMOS[i];
  const local = Math.max(0, Math.min(1, (p - t.desde) / (t.hasta - t.desde)));

  if (i !== tramoPuesto) {
    tramoPuesto = i;
    if (actual !== t.etapa) { actual = t.etapa; dibuja(); abreContenido(); }
    $('baja').style.opacity = i === 0 ? '' : '0';
  }

  const s = suave(local);
  expansion = entre(t.ventana[0], t.ventana[1], s);
  rebobina(ventanaVideo, entre(t.cinta[0], t.cinta[1], local));
}

/* --------------------------------------------------------- la antesala */
function antesala() {
  const v = $('antesala-video');
  const valor = $('cuenta-valor');
  let acabada = false;

  const termina = () => {
    if (acabada) return;
    acabada = true;
    valor.textContent = '100';
    $('cuenta').classList.add('se-va');
    $('sello').classList.add('encajado');
    $('antesala').classList.add('al-fondo');
    document.body.classList.add('antesala-lista');
    document.body.classList.add('abierto');
    tramoPuesto = -1;
    alBajar();
    setTimeout(abreContenido, 850);
    setTimeout(() => $('cuenta').remove(), 750);
    setTimeout(() => $('sello').classList.add('asentado'), 2000);
  };

  const cuenta = () => {
    if (acabada) return;
    if (v.duration) valor.textContent = String(Math.round(v.currentTime / v.duration * 100));
    requestAnimationFrame(cuenta);
  };

  const empieza = () => {
    /* El metraje dura lo que dure; la antesala dura tres segundos. Se acelera
       para que cuadren, con un suelo por si el vídeo fuera cortísimo. */
    if (v.duration) v.playbackRate = Math.max(.25, v.duration / 3);
    v.play().then(() => requestAnimationFrame(cuenta)).catch(termina);
  };

  v.addEventListener('ended', termina, { once: true });
  if (v.readyState >= 1) empieza();
  else v.addEventListener('loadedmetadata', empieza, { once: true });
  /* Red lenta, archivo que no llega, autoplay bloqueado: pasados cinco
     segundos se entra igual. Una antesala que no termina es una web rota. */
  setTimeout(termina, 5000);
}

/* ----------------------------------------------------------- el cursor */
let px = window.innerWidth / 2, py = window.innerHeight / 2;
let ax = px, ay = py;
function giraCursor() {
  ax += (px - ax) * .2;
  ay += (py - ay) * .2;
  aro.style.transform = 'translate3d(' + ax + 'px,' + ay + 'px,0) translate(-50%,-50%)';
  punto.style.transform = 'translate3d(' + px + 'px,' + py + 'px,0) translate(-50%,-50%)';
  requestAnimationFrame(giraCursor);
}

/* ------------------------------------------------------------ escuchas */
window.addEventListener('resize', () => { midelienzo(); alBajar(); });
window.addEventListener('scroll', alBajar, { passive: true });
window.addEventListener('pointermove', (ev) => {
  px = ev.clientX; py = ev.clientY;
  cursor.classList.add('se-ve');
  metaY = (ev.clientX / window.innerWidth - .5) * 34;
  metaX = (ev.clientY / window.innerHeight - .5) * -30;
});
window.addEventListener('pointerleave', () => { metaX = 0; metaY = 0; });
document.addEventListener('mouseleave', () => cursor.classList.remove('se-ve'));

/* ------------------------------------------------------------ arranque */
midelienzo();
dibuja();
alBajar();
requestAnimationFrame(pinta);
requestAnimationFrame(giraCursor);
antesala();
})();
</script>
